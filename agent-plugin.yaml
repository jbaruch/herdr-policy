schemaVersion: 1
name: jbaruch/herdr-policy
version: 0.3.0
description: Herdr team coordination policy for AI coding agents
source:
  repository: https://github.com/jbaruch/herdr-policy
artifacts:
  rules:
    - id: herdr-scope
      path: rules/herdr-scope.md
      activation:
        mode: always
    - id: agent-team-operation
      path: rules/agent-team-operation.md
      activation:
        mode: always
    - id: herdr-bootstrap
      path: rules/herdr-bootstrap.md
      activation:
        mode: paths
        paths:
          - skills/herdr-foreman/**
          - skills/herdr-standup/**
          - '**/skills/**'
    - id: coding-policy-integration
      path: rules/coding-policy-integration.md
      activation:
        mode: paths
        paths: ['**']
  skills:
    - id: herdr-foreman
      path: skills/herdr-foreman
    - id: herdr-standup
      path: skills/herdr-standup
  hooks:
    - id: herdr-session-start
      event: session-start
      path: skills/herdr-foreman/native-hook.sh
      args: [session-start]
    - id: herdr-reset-input
      event: user-prompt-submit
      path: skills/herdr-foreman/native-hook.sh
      args: [reset-input]
    - id: herdr-supervision-stop
      event: stop
      path: skills/herdr-foreman/native-hook.sh
      args: [supervision-stop]
