name: Publish extracted Herdr plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-herdr-policy
  cancel-in-progress: false

jobs:
  gates:
    # Only the reusable runtime gate looks up prior PR runs and artifacts.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/tests.yml
    with:
      reuse_runtime: true
    secrets: inherit
  tessl:
    needs: gates
    if: github.ref == 'refs/heads/main'
    environment: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7; Dependabot weekly
        with:
          fetch-depth: 0
      - uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2; Dependabot weekly
        with:
          token: ${{ secrets.TESSL_PUBLISH_TOKEN }}
      # Review these shared release-action pins monthly in a dedicated compatibility PR.
      - name: Capture original registry baseline
        id: baseline
        uses: jbaruch/coding-policy/.github/actions/publish-landed-gate@894668183834d39a117bea893058820fb9e9a630
        with:
          phase: capture
      - name: Publish explicit manifest version
        id: publish
        continue-on-error: true
        uses: jbaruch/coding-policy/.github/actions/smart-publish@894668183834d39a117bea893058820fb9e9a630
        with:
          mode: as-is
      - name: Confirm Tessl publication
        uses: jbaruch/coding-policy/.github/actions/publish-landed-gate@894668183834d39a117bea893058820fb9e9a630
        with:
          phase: confirm
          baseline: ${{ steps.baseline.outputs.baseline }}
          publish-outcome: ${{ steps.publish.outcome }}
          credit-signature: ${{ steps.publish.outputs.credit-signature }}
  # Failed ACR publication reruns independently: keep the successful Tessl job
  # and its original baseline with `gh run rerun <run-id> --failed`.
  acr:
    needs: tessl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7; Dependabot weekly
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7; Dependabot weekly
        with:
          # Match the ACR module; review monthly with its revision below.
          go-version: '1.27.0'
          cache: false
      - name: Install pinned ACR publisher
        # Review monthly and after release-contract changes, in a dedicated PR.
        run: GOBIN="$RUNNER_TEMP/acr-bin" go install github.com/jbaruch/agentic-context-registry/cmd/acr@f8dffcecc0eb98f13b2d7d90cd399f99208becf2
      - name: Publish immutable ACR tag and asset
        # Extraction publisher with controlled Git diagnostics and tested action forwarding.
        # Renew monthly with coding-policy releases, after the candidate's review gates pass.
        uses: jbaruch/coding-policy/.github/actions/publish-acr@0dbe6a75928d47cbd279a60fd3be3be9bf30695c
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          bin-directory: ${{ runner.temp }}/acr-bin
          source-commit: ${{ github.sha }}
